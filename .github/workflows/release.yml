name: Release

# Tag-driven release. Push a tag to the GitHub remote:
#   git tag v0.5.6 && git push github v0.5.6
#
# Produces (all from one GoReleaser run):
#   * tarballs/zip for linux, darwin, freebsd, windows (amd64, arm64)
#   * .deb / .rpm / .apk packages
#   * Homebrew formula -> davidcrumpton/homebrew-tap
#   * Scoop manifest   -> davidcrumpton/scoop-bucket
#   * checksums.txt + SPDX SBOMs + keyless cosign signature
#   * SLSA build provenance attestations for every artifact
# and separately publishes a multi-arch image to ghcr.io.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload assets
  id-token: write # cosign keyless signing + provenance attestation
  attestations: write
  packages: write # push to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION_FILE: go.mod
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog can be generated

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft (SBOMs)
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on davidcrumpton/homebrew-tap and
          # davidcrumpton/scoop-bucket. The workflow's own GITHUB_TOKEN cannot
          # push to a different repository.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk

      - name: Release summary
        run: |
          {
            echo "## Release ${{ github.ref_name }}"
            echo
            echo "| Artifact | Size |"
            echo "| --- | --- |"
            find dist -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \
                 -o -name '*.rpm' -o -name '*.apk' -o -name 'checksums.txt' \) \
              -exec du -h {} + | sort -k2 | awk '{printf "| `%s` | %s |\n", $2, $1}'
            echo
            echo "Signed with cosign (keyless). Verify:"
            echo '```'
            echo "cosign verify-blob --bundle checksums.txt.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  checksums.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=mcwsd
            org.opencontainers.image.description=Workspace daemon for ephemeral coding-agent development environments
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamps the image build with the release version instead of the
          # Version default compiled into the source tree.
          build-args: |
            MCWSD_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
