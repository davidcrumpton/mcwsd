# snippet for rc.conf
# enable mcwsd service
mcwsd_enable="YES"

mcwsd_port=9080
mcwsd_freebsd_interface=vtnet0
mcwsd_workspace_base_path=/home/wsd
mcwsd_cache_dir=/home/wsd/cache
mcwsd_plugin=/usr/local/lib/mcwsd/plugins/freebsd-jail.js
mcwsd_state_file=/home/wsd/state.json
mcwsd_user="wsd"
mcwsd_group="wsd"
mcwsd_forge_type="github"
mcwsd_github_token_env_var=GITHUB_TOKEN
mcwsd_token="wsd-1789781852887913000"
mcwsd_debug="NO"
mcwsd_audit="YES"
mcwsd_git_auth_mode=ssh
mcwsd_git_ssh_key_path_env_var=SSH_KEY_PATH
mcwsd_jobs_file=/home/wsd/jobs.json
mcwsd_bind_address=0.0.0.0
mcwsd_debug=YES
mcwsd_audit_file=/home/wsd/audit.jsonl

# Optional administrator-built jail template (omit to use official releases).
# mcwsd_base_template_url="https://templates.example.org/freebsd"
# mcwsd_freebsd_release="organization-15.1-v1.tgz"
# mcwsd_verify_signature="YES"
# mcwsd_template_public_key="/usr/local/etc/mcwsd/organization-template.pub"
#
# Optional Basic authentication; export the password in the protected env file.
# mcwsd_base_template_user="mcwsd"
# mcwsd_base_template_password_env="MCWSD_TEMPLATE_PASSWORD"
#
# Alternatively use a header; export its complete value in the env file.
# mcwsd_base_template_header="Authorization"
# mcwsd_base_template_header_env="MCWSD_TEMPLATE_AUTH"
#
# mcwsd_source_env_file="/etc/wsd/env"
